name: Publish release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Different commit releases never cancel one another. A rerun of the same commit
# shares a group; publication itself checks existing tags/assets before writing.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Test before publication
        run: python -m unittest discover -s tests -v
      - name: Validate release transition
        env:
          PUSH_BASE: ${{ github.event.before }}
        shell: bash
        run: |
          base="$PUSH_BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          python tools/repo_workflow.py validate-release --source HEAD --base-ref "$base"
      - name: Package public frontend for the existing backend host
        run: python tools/package_frontend.py
      - name: Publish immutable version and reference downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_release.py
